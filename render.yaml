databases:
  - name: vaad-bayit-db
    databaseName: vaad_bayit
    plan: free

services:
  - type: web
    name: vaad-bayit
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase (Session pooler connection string) - set manually in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_PASSWORD
        sync: false
