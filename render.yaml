databases:
  - name: vaad-bayit-db
    databaseName: vaad_bayit
    plan: free

services:
  - type: web
    name: vaad-bayit
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vaad-bayit-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_PASSWORD
        sync: false
